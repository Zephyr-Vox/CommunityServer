# ZephyrVox server configuration, generated on first startup.
# The jwt_secret is filled with a fresh random value when this file is created.
jwt_secret = ""

[auth]
access_token_ttl = "15m"
refresh_token_ttl = "720h"
login_rate_limit = 10
registration_mode = "invite"

[server]
host = "0.0.0.0"
http_port = 8745
voice_port = 8746
db_path = "./data/zephyr.db"

[storage]
base_dir = "./data/objects"

[avatar]
max_upload_size = 10485760  # avatar upload size limit in bytes (default 10 MiB)
max_dimension = 4096        # source image max side in pixels; rejects decompression bombs
target_size = 256           # output avatar side in pixels (square)
quality = 85                # JPEG quality, 0-100

[log]
level = "info"
path = "./data/logs"
archive_keep = 7
